# Standalone (its own `[workspace]`, like `fuzz/`) so that evaluating a SIMD
# crate never puts a dependency into the shipped tree. Nothing here is built by
# a root `cargo build`.
[package]
name = "simd-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
fearless_simd = "0.7.0"

# Mirrors `[profile.release]` in the root `Cargo.toml` exactly, and that is the
# entire point of this crate. `profile.bench` there matches the shipping
# `opt-level` but deliberately keeps `lto = false` / `codegen-units = 16` so the
# bench suite stays usable for iteration — which leaves cross-crate inlining,
# precisely the variable a generic `#[inline(always)]` SIMD crate lives or dies
# on, unmeasured. Keep these five keys in sync with the root profile.
[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1

# For the "is this an -Oz artifact?" question. Same profile, one key changed.
[profile.o2]
inherits = "release"
opt-level = 2

[profile.o3]
inherits = "release"
opt-level = 3

# Unstripped, for disassembly.
[profile.syms]
inherits = "release"
strip = false
