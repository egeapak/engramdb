version: 2

# Keeps the committed Cargo.lock moving on its own. CI builds with `--locked`,
# and the advisory check (.github/workflows/audit.yml) only reports: it files
# an issue when its weekly run fails. Without this a published advisory is
# *reported* but never *fixed* until someone runs `cargo update` by hand.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # After the fuzz (04:00) and audit (05:00) Monday runs, so a PR opened here
    # lands against a tree whose advisory status was just refreshed.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the routine lockfile churn. These are semver-compatible by
      # construction, so they pass or fail as a unit and reviewing them
      # individually is noise.
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to `=2.0.0-rc.15` by fastembed 7.5. The C API level (24, so
      # ONNX Runtime >= 1.24) comes from the `api-24` feature, not the ort
      # version. A bump here that fastembed hasn't made would fail to resolve;
      # one it *has* made arrives via fastembed anyway.
      - dependency-name: "ort"
      # The arrow major must match what lancedb requires (`^58` as of 0.37,
      # and still in 0.39).
      # Moving it independently forks the arrow types at the lancedb boundary
      # and does not compile — see docs/contributors/architecture.md.
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
      # Tracks fastembed's `^0.23.2`; a major bump here silently doubles the
      # tokenizers + onig build instead of unifying. See the note in
      # crates/engram-models/Cargo.toml.
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-major"]
      # Same story: fastembed requires `^0.5`, so hf-hub 1.x would resolve
      # alongside it rather than replacing it.
      - dependency-name: "hf-hub"
        update-types: ["version-update:semver-major"]
      # No lancedb after 0.37 builds here yet. 0.38-0.40 do not compile with
      # `default-features = false` (`job.rs` names `Error::Http`, which exists
      # only with the `remote` feature). 0.41 compiles but turns on
      # serde_json's `preserve_order` feature, which Cargo unifies into every
      # crate: JSON objects stop sorting their keys, so CLI/MCP JSON output,
      # the insta snapshots and the dashboard's pinned layout digests change.
      # `serde_json_maps_sort_their_keys` in engram-storage fails if it gets
      # in. Bump by hand once a release fixes one of the two.
      - dependency-name: "lancedb"
        versions: [">= 0.38"]

  # `fuzz/` declares its own `[workspace]` (the cargo-fuzz layout, so libfuzzer
  # and its nightly sanitizer flags stay out of ordinary builds), which makes it
  # invisible to the `/` entry above — its lockfile went untouched for months
  # while the root's kept moving, until the two had drifted far enough that any
  # resolution inside `fuzz/` rewrote ~3200 lines and `--locked` failed on a
  # clean checkout. Workspace dependency inheritance cannot fix this: a crate
  # that owns a workspace cannot inherit from an outer one, and the crates that
  # actually drift are transitive (through the `engramdb` path dep), which
  # inheritance would not unify anyway. So give it its own schedule.
  #
  # The `ignore` list is duplicated deliberately rather than shared — dependabot
  # has no include mechanism, and every reason above applies identically here.
  # `ci.yml`'s lockfile-parity job is the backstop if this drifts again.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "ort"
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hf-hub"
        update-types: ["version-update:semver-major"]
      # No lancedb after 0.37 builds here yet. 0.38-0.40 do not compile with
      # `default-features = false` (`job.rs` names `Error::Http`, which exists
      # only with the `remote` feature). 0.41 compiles but turns on
      # serde_json's `preserve_order` feature, which Cargo unifies into every
      # crate: JSON objects stop sorting their keys, so CLI/MCP JSON output,
      # the insta snapshots and the dashboard's pinned layout digests change.
      # `serde_json_maps_sort_their_keys` in engram-storage fails if it gets
      # in. Bump by hand once a release fixes one of the two.
      - dependency-name: "lancedb"
        versions: [">= 0.38"]

  # The one npm dependency in the repository: `playwright-core`, the driver of
  # the dashboard's browser checks (never embedded, never shipped). Pinned by
  # a lockfile that CI installs with `npm ci --ignore-scripts`.
  - package-ecosystem: npm
    directory: "/crates/engram-dashboard/bench/browser"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  # rust-toolchain.toml pins the exact stable release CI and the release
  # workflow build with. Without this entry the pin would only ever move by
  # hand; with it a new compiler arrives as a PR that runs the whole suite.
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(toolchain)"

  # Every `uses:` is pinned to a commit SHA with the version in a trailing
  # comment; Dependabot updates both. "/" covers .github/workflows; a composite
  # action's own `uses:` lines are only seen when its directory is listed.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/install-onnxruntime"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
