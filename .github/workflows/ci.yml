name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the build under the runner's ~30 GB disk and speed it up. The layered
  # workspace produces ~8 heavy test binaries that each statically link the
  # lancedb/arrow/datafusion/onnx stack; full debuginfo on every one is the bulk
  # of `target/` and a chunk of compile time. CI never attaches a debugger, and
  # nextest still reports the failing test name + assertion message without it,
  # so we drop debuginfo entirely (`debug=0`). Incremental compilation is dead
  # weight on a clean checkout. (~38 GB -> well under 10 GB.)
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Criterion benches ([[bench]] in Cargo.toml) are deliberately NOT run in CI:
# they need the full ONNX runtime plus downloaded embedding models, and
# shared-runner variance makes any timing threshold flaky. They are local
# tools — run `cargo bench` and diff target/criterion reports across commits.

jobs:
  # Cheap, toolchain-free guard: the plugin version lives in TWO manifests
  # (.claude-plugin/plugin.json and .claude-plugin/marketplace.json). If they
  # drift, `/plugin update` compares the marketplace entry and silently keeps
  # the stale install pinned — the plugin's MCP server then loads an old cached
  # version. Fail fast when they disagree so releases can't ship the mismatch.
  manifest-version:
    name: Manifest version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plugin.json == marketplace.json version
        run: |
          plugin_ver=$(jq -r '.version' .claude-plugin/plugin.json)
          market_ver=$(jq -r '.plugins[] | select(.name == "engram") | .version' .claude-plugin/marketplace.json)
          echo "plugin.json:      $plugin_ver"
          echo "marketplace.json: $market_ver"
          if [ -z "$plugin_ver" ] || [ "$plugin_ver" = "null" ]; then
            echo "::error file=.claude-plugin/plugin.json::missing .version"; exit 1
          fi
          if [ -z "$market_ver" ] || [ "$market_ver" = "null" ]; then
            echo "::error file=.claude-plugin/marketplace.json::engram plugin entry is missing .version (add it, matching plugin.json)"; exit 1
          fi
          if [ "$plugin_ver" != "$market_ver" ]; then
            echo "::error::plugin.json ($plugin_ver) and marketplace.json ($market_ver) disagree — bump both together"; exit 1
          fi
          echo "OK: versions match ($plugin_ver)"

  fuzz-lockfile-parity:
    name: Fuzz lockfile parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `fuzz/` is its own workspace, so nothing in a normal build reads its
      # lockfile and nothing keeps it current — it sat untouched for months
      # while the root's moved with every dependabot batch, until `--locked`
      # failed inside `fuzz/` on a clean checkout and any resolution there
      # rewrote ~3200 lines. Dependabot now watches `/fuzz` too; this is the
      # backstop that makes the drift visible if that ever lapses.
      #
      # Compares only crates present in BOTH lockfiles: `fuzz/` legitimately
      # carries libfuzzer/arbitrary that the root does not, and the root
      # carries plenty `fuzz/` never pulls in. A shared crate resolving to two
      # different versions is the actual defect — it means the fuzz targets
      # exercise different code than the crate CI tests.
      - name: Check fuzz/Cargo.lock agrees with the root workspace
        run: |
          python3 - <<'PY'
          import re, sys

          def versions(path):
              found = {}
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
              for block in text.split("[[package]]"):
                  name = re.search(r'^name = "(.+?)"', block, re.M)
                  version = re.search(r'^version = "(.+?)"', block, re.M)
                  if name and version:
                      found.setdefault(name.group(1), set()).add(version.group(1))
              return found

          root = versions("Cargo.lock")
          fuzz = versions("fuzz/Cargo.lock")
          shared = sorted(set(root) & set(fuzz))
          drift = [(n, sorted(root[n]), sorted(fuzz[n])) for n in shared if root[n] != fuzz[n]]

          print(f"shared crates: {len(shared)}")
          print(f"version disagreements: {len(drift)}")
          for name, root_versions, fuzz_versions in drift:
              print(f"  {name}: root={root_versions} fuzz={fuzz_versions}")

          if drift:
              print(
                  "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock has drifted from the "
                  "root workspace. For each crate above run, inside fuzz/: "
                  "cargo update -p <crate> --precise <root-version>"
              )
              sys.exit(1)
          print("OK: fuzz/Cargo.lock agrees with the root workspace on every shared crate")
          PY

  formatter-output:
    name: CLI output goes through the formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `OutputFormatter` writes through an injectable `Sink` (real streams in
      # production, an in-memory buffer under `#[cfg(test)]`), which is what
      # makes the tier-1 renderer snapshots possible at all — a snapshot needs
      # the rendered bytes as a *value*, and a bare `println!` sends them
      # somewhere no in-process test can read. A single reintroduced `println!`
      # is invisible to tier 1 forever, and silently so.
      #
      # Exempt, both deliberately outside the formatter:
      #   - output.rs        defines the macros.
      #   - commands/hook.rs emits the hook protocol document that Claude Code
      #                      parses off stdout, plus its stderr diagnostics.
      #                      Styling or JSON-wrapping must never reach it, and
      #                      those handlers hold no formatter.
      # `#[cfg(test)]` bodies are skipped: `println!` in a test is debugging
      # output, not product output.
      - name: No bare println!/eprintln!/print!/eprint! in engram-cli
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          EXEMPT = {"output.rs", "hook.rs"}
          PRINT = re.compile(r"(?<![\w:])(eprintln|println|eprint|print)!\(")
          TEST_MOD = re.compile(r"^\s*mod tests\s*\{")

          offenders = []
          for path in sorted(pathlib.Path("crates/engram-cli/src").rglob("*.rs")):
              if path.name in EXEMPT:
                  continue
              lines = path.read_text(encoding="utf-8").split("\n")
              # Everything from `mod tests {` on is test code. Match the real
              # module opener, not the first `#[cfg(test)]` — hook.rs carries
              # that attribute on plain helper fns hundreds of lines earlier.
              cutoff = next(
                  (i for i, line in enumerate(lines) if TEST_MOD.match(line)), len(lines)
              )
              for i, line in enumerate(lines[:cutoff]):
                  if PRINT.search(line):
                      offenders.append(f"{path}:{i + 1}: {line.strip()}")

          if offenders:
              for entry in offenders:
                  print(entry)
              print(
                  "::error::bare print macros bypass OutputFormatter's Sink and are "
                  "invisible to the tier-1 snapshots. Use outln! / errln! / outraw! / "
                  "errraw! from crate::output (see docs/contributors/testing.md)."
              )
              sys.exit(1)
          print("OK: all engram-cli output goes through OutputFormatter")
          PY

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The `ollama` feature is on by default and gates `#[cfg(feature = "ollama")]`
      # branches (e.g. in src/ops/mod.rs). The all-features build above never
      # exercises the pure-ONNX path, so a `--no-default-features` compile break
      # would otherwise ship unnoticed. Cheap `check` only.
      # `--no-default-features` also strips `engram-onnx`'s own default, so a
      # linking strategy has to be named explicitly or the build stops at the
      # "needs an ONNX Runtime linking strategy" compile_error.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features --features onnxruntime,load-dynamic --locked

      # The mirror image of the step above: ONNX compiled out entirely, with
      # Ollama the only embedding backend. `#[cfg(feature = "onnxruntime")]`
      # gates a large surface here (the whole reranker loader, NLI, T5), and no
      # other CI job builds the crate without it, so that surface had no
      # compile coverage at all. It was in fact broken when this step was
      # added: a doc comment inserted between `resolve_reranker_model`'s
      # `#[cfg]` and the function itself moved the gate onto its new neighbour,
      # leaving `RerankerModel` — a `fastembed` type that does not exist in
      # this configuration — referenced unconditionally.
      #
      # `load-dynamic` is named explicitly for the same reason as above:
      # `--no-default-features` also strips `engram-onnx`'s own default, and it
      # is a workspace member, so `--workspace` checks it even though nothing
      # depends on it once `onnxruntime` is off.
      - name: Check (Ollama only, ONNX compiled out)
        run: cargo check --workspace --no-default-features --features ollama,load-dynamic --locked

  # Linux full tests run in the `test` job below; this matrix covers the
  # non-Linux targets that `release.yml` actually ships (macOS + Windows):
  # a full-workspace `cargo check` so every platform-gated line compiles on
  # every PR, plus a small filtered nextest subset so the platform-divergent
  # IPC/filesystem code — most importantly the Windows named-pipe daemon
  # transport (`#[cfg(windows)]` in src/daemon/transport.rs) vs the
  # `#[cfg(unix)]` Unix-socket path, path resolution, and the advisory write
  # lock — is actually EXECUTED off Linux instead of first failing at release
  # time. The subset must stay model-free: no ONNX models are staged on these
  # runners, so any model-loading test would fail here.
  check-cross:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@v2

      - name: Check
        # ONNX Runtime is downloaded + statically linked by fastembed's
        # `download-binaries` (same as release.yml), so no manual ORT setup.
        run: cargo check --workspace --all-features --locked

      - name: Install nextest
        # Prebuilt binary, same rationale as the `test` job below.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test platform-gated IPC and filesystem code
        # `daemon::transport` exercises the Unix-socket/named-pipe transports
        # (bind/yield/reclaim/permissions), `paths::tests` the platform dir
        # resolution, `write_lock::tests` the fs4 advisory-lock semantics.
        # All three use only temp dirs — no models, no network (see the job
        # comment above before adding filters).
        run: >-
          cargo nextest run --workspace --all-features --locked
          -E 'test(daemon::transport) + test(paths::tests) + test(write_lock::tests)'

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        # Use the prebuilt binary instead of `cargo install cargo-nextest`,
        # which compiles nextest from source (~7 min on a cache miss). This
        # downloads a prebuilt release in seconds, every run, regardless of
        # cache state.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install ONNX Runtime
        # `--all-features` enables `load-dynamic` alongside `bundled-onnxruntime`,
        # and `ort` takes the dlopen path whenever `load-dynamic` is on — so a
        # real shared library has to be present even though a static one is also
        # linked in. Before the runtime became external, the static link alone
        # was enough here.
        run: |
          curl -sSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo cp "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so.${ONNXRUNTIME_VERSION}" \
                  /usr/local/lib/libonnxruntime.so
          sudo ldconfig

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked

  # `--all-features` necessarily turns `bundled-onnxruntime` back on, so the job
  # above links ONNX Runtime statically and never exercises what users actually
  # ship: default features, where the runtime is `dlopen`ed at run time. This job
  # covers that path — including the case that used to abort the process, a
  # *missing* runtime, which must degrade to "embeddings unavailable" instead.
  test-load-dynamic:
    name: Test (default features, runtime-loaded ONNX)
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install ONNX Runtime
        # The official Microsoft build. Deliberately not the one `ort` would
        # download: that prebuilt executes quantized models incorrectly on
        # AVX-512/AMX hosts. See docs/contributors/embedding-model-alternatives.md.
        run: |
          curl -sSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo cp "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so.${ONNXRUNTIME_VERSION}" \
                  /usr/local/lib/libonnxruntime.so
          sudo ldconfig

      - name: Build with default features
        # No ONNX Runtime is required to build under `load-dynamic`; this must
        # succeed on its own.
        run: cargo build --workspace --locked

      - name: Binary must not record a load-time dependency on ONNX Runtime
        # The property that makes graceful degradation possible at all. If
        # libonnxruntime becomes a DT_NEEDED entry, the dynamic loader resolves
        # it before `main()` runs, and a missing runtime stops the binary from
        # starting -- no `doctor`, no fallback, and the pre-flight probe never
        # gets a turn. Switching a strategy feature into `default` would cause
        # exactly that, silently.
        run: |
          if ldd target/debug/engramdb | grep -qi onnxruntime; then
            echo "::error::engramdb links libonnxruntime at load time; the default \
          build must resolve it at run time so a missing runtime degrades instead \
          of blocking startup."
            ldd target/debug/engramdb | grep -i onnxruntime
            exit 1
          fi
          echo "OK: no load-time ONNX Runtime dependency recorded."

      - name: Binary must start with no runtime installed
        run: ./target/debug/engramdb --version

      - name: Test with the runtime discovered from /usr/local/lib
        # No ORT_DYLIB_PATH: this asserts the built-in search path finds a
        # system-installed runtime the way a Homebrew or distro install would.
        run: cargo nextest run --workspace --locked

      - name: Missing runtime must degrade, not abort
        # The regression guard for the whole change. `ort`'s own loader panics
        # when the dylib is absent and the release profile is `panic = "abort"`,
        # so without the pre-flight probe in `engram_onnx::runtime` this aborts.
        run: |
          sudo rm /usr/local/lib/libonnxruntime.so
          sudo ldconfig
          cargo nextest run --workspace --locked -E 'test(runtime::tests::)'
          echo "Probe reports:"
          cargo run --quiet --locked --bin engramdb -- doctor || true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # `llvm-tools-preview` ships `llvm-profdata`/`llvm-cov`, which
        # cargo-llvm-cov shells out to for instrumentation-based coverage.
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest and cargo-llvm-cov
        # Prebuilt binaries (same rationale as the test job): avoids a
        # ~7 min from-source compile of each tool on a cache miss.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Install ONNX Runtime
        # `--all-features` enables `load-dynamic` alongside `bundled-onnxruntime`,
        # and `ort` takes the dlopen path whenever `load-dynamic` is on — so a
        # real shared library has to be present even though a static one is also
        # linked in. Before the runtime became external, the static link alone
        # was enough here.
        run: |
          curl -sSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo cp "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so.${ONNXRUNTIME_VERSION}" \
                  /usr/local/lib/libonnxruntime.so
          sudo ldconfig

      - name: Run tests under coverage instrumentation
        # Mirror the `test` job's invocation so coverage reflects the real
        # suite. `--no-report` defers report generation so we can emit
        # multiple formats from the one profdata set below.
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report

      - name: Generate coverage reports
        # Exclude integration-test harness files and the test-isolation crate
        # from the denominator so the percentage tracks production code.
        env:
          IGNORE: '(/tests?/|test_support|engram-test-support|/benches/|/examples/|/fuzz/)'
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$IGNORE"
          {
            echo '## Coverage summary'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
