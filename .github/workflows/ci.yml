name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the build under the runner's ~30 GB disk and speed it up. The layered
  # workspace produces ~8 heavy test binaries that each statically link the
  # lancedb/arrow/datafusion/onnx stack; full debuginfo on every one is the bulk
  # of `target/` and a chunk of compile time. CI never attaches a debugger, and
  # nextest still reports the failing test name + assertion message without it,
  # so we drop debuginfo entirely (`debug=0`). Incremental compilation is dead
  # weight on a clean checkout. (~38 GB -> well under 10 GB.)
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Every `cargo nextest` in this workflow (`cargo llvm-cov nextest` included)
  # runs the `ci` profile from .config/nextest.toml: no fail-fast, a test that
  # runs longer than 5 minutes is terminated and reported by name, and a JUnit
  # report is written to target/nextest/ci/junit.xml. Set here, not as a
  # `--profile ci` flag on each command, so a new nextest step cannot forget
  # it (and `cargo llvm-cov` has a `--profile` of its own).
  NEXTEST_PROFILE: ci

# A newer push to the same PR makes the older run's result worthless; cancel
# it instead of letting it hold ~12 runners. Pushes to master are never
# cancelled, so every master commit still gets a complete run (and saves the
# caches every PR restores from).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository: caches and artifacts use the runner's own
# token, not GITHUB_TOKEN. Keep the token read-only.
permissions:
  contents: read

# Caching policy: every `Swatinem/rust-cache` step below restores everywhere but
# saves only on master (`save-if`). One run saves ~6.5 GB of caches (nine
# compiling jobs at 0.45-0.9 GB each) against the repository's 10 GB cache
# quota, so when PR branches saved too, each PR run evicted master's entries:
# in a 12-run sample, the Linux `Test` job restored nothing on all four master
# pushes and had to compile ~580 crates from scratch (5-9 min) each time. A PR
# branch's own cache only ever helped a PR that changed Cargo.lock, since
# rust-cache never stores workspace crates anyway.
#
# That includes Dependabot PRs, deliberately. Their Cargo.lock differs, so the
# exact key misses, but rust-cache's restore key (`v0-rust-<job>-<os>-<env
# hash>`, no lockfile hash) still matches master's newest entry for the same
# job: the run restores master's dependencies and rebuilds only the bumped
# crates and their dependents. Saving there would buy a full-hit second push
# at ~6.5 GB per run, scoped to that PR's ref alone, which is exactly the
# eviction of master's entries this policy exists to stop. (The Dependabot run
# 41399668398, before this policy, restored nothing: by then PR saves had
# evicted master's `test` entry, so it compiled all 584 crates in 9 min.)

# Every job has a `timeout-minutes`. Without one a hung test or a stalled
# download holds its runner for GitHub's 6-hour default. Each value is well
# above the slowest run of that job in a 25-run sample (cold caches included;
# medians are 3 to 10 times lower), so it cuts off a hang, not a slow day.

# Toolchain: every job runs `rustup toolchain install` with no argument, which
# installs exactly what rust-toolchain.toml pins (see that file for why). Do
# not write `stable` here again; a job that names its own toolchain no longer
# tests the compiler the release is built with.

# Criterion benches ([[bench]] in Cargo.toml) are deliberately NOT run in CI:
# they need the full ONNX runtime plus downloaded embedding models, and
# shared-runner variance makes any timing threshold flaky. They are local
# tools — run `cargo bench` and diff target/criterion reports across commits.

jobs:
  # Cheap, toolchain-free guard: the plugin version lives in TWO manifests
  # (.claude-plugin/plugin.json and .claude-plugin/marketplace.json). If they
  # drift, `/plugin update` compares the marketplace entry and silently keeps
  # the stale install pinned — the plugin's MCP server then loads an old cached
  # version. Fail fast when they disagree so releases can't ship the mismatch.
  manifest-version:
    name: Manifest version parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check plugin.json == marketplace.json version
        run: |
          plugin_ver=$(jq -r '.version' .claude-plugin/plugin.json)
          market_ver=$(jq -r '.plugins[] | select(.name == "engram") | .version' .claude-plugin/marketplace.json)
          echo "plugin.json:      $plugin_ver"
          echo "marketplace.json: $market_ver"
          if [ -z "$plugin_ver" ] || [ "$plugin_ver" = "null" ]; then
            echo "::error file=.claude-plugin/plugin.json::missing .version"; exit 1
          fi
          if [ -z "$market_ver" ] || [ "$market_ver" = "null" ]; then
            echo "::error file=.claude-plugin/marketplace.json::engram plugin entry is missing .version (add it, matching plugin.json)"; exit 1
          fi
          if [ "$plugin_ver" != "$market_ver" ]; then
            echo "::error::plugin.json ($plugin_ver) and marketplace.json ($market_ver) disagree — bump both together"; exit 1
          fi
          echo "OK: versions match ($plugin_ver)"

  fuzz-lockfile-parity:
    name: Fuzz lockfile parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `fuzz/` is its own workspace, so nothing in a normal build reads its
      # lockfile and nothing keeps it current — it sat untouched for months
      # while the root's moved with every dependabot batch, until `--locked`
      # failed inside `fuzz/` on a clean checkout and any resolution there
      # rewrote ~3200 lines. Dependabot now watches `/fuzz` too; this is the
      # backstop that makes the drift visible if that ever lapses.
      #
      # Compares only crates present in BOTH lockfiles: `fuzz/` legitimately
      # carries libfuzzer/arbitrary that the root does not, and the root
      # carries plenty `fuzz/` never pulls in. A shared crate resolving to two
      # different versions is the actual defect — it means the fuzz targets
      # exercise different code than the crate CI tests.
      - name: Check fuzz/Cargo.lock agrees with the root workspace
        run: |
          python3 - <<'PY'
          import re, sys

          def versions(path):
              found = {}
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
              for block in text.split("[[package]]"):
                  name = re.search(r'^name = "(.+?)"', block, re.M)
                  version = re.search(r'^version = "(.+?)"', block, re.M)
                  if name and version:
                      found.setdefault(name.group(1), set()).add(version.group(1))
              return found

          root = versions("Cargo.lock")
          fuzz = versions("fuzz/Cargo.lock")
          shared = sorted(set(root) & set(fuzz))
          # A version only the root carries is fine: it comes from a root-only
          # edge (e.g. `criterion`, a dev-dependency, pulls itertools 0.13) that
          # fuzz/ cannot resolve. The defect is fuzz/ building a version the
          # root does not, i.e. code CI never tests.
          drift = [(n, sorted(root[n]), sorted(fuzz[n])) for n in shared if fuzz[n] - root[n]]

          print(f"shared crates: {len(shared)}")
          print(f"version disagreements: {len(drift)}")
          for name, root_versions, fuzz_versions in drift:
              print(f"  {name}: root={root_versions} fuzz={fuzz_versions}")

          if drift:
              print(
                  "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock has drifted from the "
                  "root workspace. For each crate above run, inside fuzz/: "
                  "cargo update -p <crate> --precise <root-version>"
              )
              sys.exit(1)
          print("OK: fuzz/Cargo.lock agrees with the root workspace on every shared crate")
          PY

  # The fuzz targets are a separate workspace (`fuzz/`) that only fuzz.yml
  # builds, on Mondays. A pull request that renames a function a target calls,
  # or adds a target file without its `[[bin]]`, used to be found out a week
  # later, by an issue. This type-checks them on the pull request: `cargo
  # check` on the pinned stable toolchain, no nightly, no sanitizer, no run.
  #
  # The job always runs and decides in its first step whether the change can
  # affect the targets. It cannot be skipped with `paths:` or a job-level
  # `if:`: a skipped job reports `skipped`, and `CI result` fails on anything
  # but `success`. When nothing relevant changed, the remaining steps are
  # skipped and the job succeeds in seconds.
  fuzz-check:
    name: Fuzz targets type-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff below needs the base commit.
          fetch-depth: 0

      - name: Did anything the fuzz targets build from change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # What the targets are built from: their own crate, the modules they
          # call (scope and score math, the memory-file and registry parsers,
          # the shared types), every manifest and lockfile, the toolchain pin,
          # and this workflow. Add a path here when a new target reaches into
          # a new module.
          paths='^(fuzz/|src/scoring/|src/scope/|src/ops/harvest\.rs$|src/daemon/protocol\.rs$|src/lib\.rs$|crates/engram-storage/|crates/engram-types/|Cargo\.(toml|lock)$|crates/[^/]+/Cargo\.toml$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range=""
          fi
          if [ -n "$range" ]; then
            # A diff that cannot be computed means "check", never "skip".
            if files=$(git diff --name-only "$range"); then
              if printf '%s\n' "$files" | grep -Eq "$paths"; then
                echo "Changed files the fuzz targets depend on:"
                printf '%s\n' "$files" | grep -E "$paths"
              else
                run=false
                echo "Nothing the fuzz targets build from changed in $range; skipping the check."
              fi
            else
              echo "::warning::could not diff $range; running the check"
            fi
          else
            echo "No base commit to compare with; running the check."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        if: steps.changed.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: "fuzz -> target"
          key: fuzz-check
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Every [[bin]] has its target file, and every target file its [[bin]]
        # `cargo fuzz build` builds every `[[bin]]`, so one missing on either
        # side breaks the whole weekly build. `cargo check` reports a missing
        # file; nothing reports a target file nobody registered.
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^path = "fuzz_targets\/\(.*\)\.rs"$/\1/p' fuzz/Cargo.toml | sort)
          present=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -exec basename {} .rs \; | sort)
          if [ "$declared" != "$present" ]; then
            echo "::error file=fuzz/Cargo.toml::[[bin]] entries and fuzz/fuzz_targets/*.rs disagree"
            diff <(echo "$declared") <(echo "$present") || true
            exit 1
          fi
          echo "OK: $(echo "$present" | wc -l) targets, each registered."

      - name: Type-check the fuzz targets
        if: steps.changed.outputs.run == 'true'
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  formatter-output:
    name: CLI output goes through the formatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `OutputFormatter` writes through an injectable `Sink` (real streams in
      # production, an in-memory buffer under `#[cfg(test)]`), which is what
      # makes the tier-1 renderer snapshots possible at all — a snapshot needs
      # the rendered bytes as a *value*, and a bare `println!` sends them
      # somewhere no in-process test can read. A single reintroduced `println!`
      # is invisible to tier 1 forever, and silently so.
      #
      # Exempt, deliberately outside the formatter:
      #   - commands/hook/protocol.rs emits the hook protocol document that
      #                      Claude Code parses off stdout, plus the hooks'
      #                      stderr diagnostics (`read_stdin`,
      #                      `print_hook_output`, `warn_unknown_hook`,
      #                      `warn_unparseable_hook_args`). Styling or
      #                      JSON-wrapping must never reach it, and those
      #                      functions hold no formatter. The rest of
      #                      commands/hook/ is scanned like any other file.
      #
      # output.rs is NOT exempt as a file. It was, on the grounds that it
      # defines the macros — and that hole is how `print_harvest_sessions`
      # arrived writing to the real stdout, invisible to tier 1 for exactly the
      # reason this job exists. The only legitimate print macros in the crate
      # are the four inside `impl Sink`, which are the sink, so they are
      # allowed by their exact shape and nothing else in the file is.
      #
      # `#[cfg(test)]` module bodies are skipped: `println!` in a test is
      # debugging output, not product output.
      #
      # The scanner is .github/scripts/check_print_macros.py (run it locally
      # the same way). It replaced an inline script with three holes: it did
      # not see `std::println!`, it stopped reading a file at the first
      # `mod tests {` (so code after a test module was never scanned), and it
      # knew nothing about `writeln!(io::stdout(), ..)`. Its `--self-test`
      # feeds it one fixture per hole and per allowed shape, and runs first so
      # a scanner that has gone blind fails the job instead of passing it.
      #
      # It also scans the library crates (the core and engram-{mcp,storage,
      # models,types,onnx,dashboard}) for writes to **stdout** only: the MCP
      # server speaks JSON-RPC there and the hooks print a protocol document,
      # so a stray `println!` in a library corrupts both.
      - name: The scanner detects what it is meant to detect
        run: python3 .github/scripts/check_print_macros.py --self-test

      - name: No bare print macro in engram-cli, no stdout write in the library crates
        run: python3 .github/scripts/check_print_macros.py

  # The dashboard frontend is vanilla ES modules with no bundler and no build
  # step, so no tool looked at the JavaScript before a browser did. Cheap
  # checks, no dependencies installed:
  #   - every module under web/js and bench parses (see the script for why it
  #     is not a plain `node --check <file>`);
  #   - the Plain style's relation geometry (bench/relations.mjs): no NaN in
  #     path data, the wide end at the source, chevron direction, bounded
  #     path length. `--no-timing` prints its timings without failing on
  #     them; shared-runner wall-clock thresholds are flaky;
  #   - the frontend's pure functions (bench/unit.mjs: tallies, routing,
  #     scope keys, number formatting, link builders) and the details
  #     panel's relation wording from both ends (bench/details.mjs).
  # The headless browser checks are the separate `frontend-browser` job.
  frontend:
    name: Frontend (syntax, relation geometry)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Every JavaScript module parses
        run: bash .github/scripts/check_frontend_syntax.sh

      - name: Relation geometry
        working-directory: crates/engram-dashboard
        run: node bench/relations.mjs --no-timing

      - name: Pure functions
        working-directory: crates/engram-dashboard
        run: node bench/unit.mjs

      - name: Details panel wording
        working-directory: crates/engram-dashboard
        run: node bench/details.mjs

  # Supply-chain gate on what a pull request itself changes: banned or
  # wildcard crates, licenses outside deny.toml's allow-list, and crates from
  # a registry or git source other than crates.io. All three are decided by
  # the PR's own Cargo.lock and deny.toml, so this job cannot go red for a
  # reason outside the PR. `advisories` is deliberately not here: it depends
  # on a database that changes daily, and runs on master pushes and weekly in
  # audit.yml, which files an issue when it fails.
  #
  # Blocking from the start: the audit run on master 5b44fc7 (2026-11-09),
  # same deny.toml and Cargo.lock, printed `bans ok, licenses ok, sources ok`.
  # A PR that adds a crate under a license the list does not name must add
  # the license (or a per-crate exception) to deny.toml in the same PR.
  deny:
    name: cargo-deny (bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check bans licenses sources

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # No argument: installs the version, profile and components that
        # rust-toolchain.toml names (rustfmt and clippy included).
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The `ollama` feature is on by default and gates `#[cfg(feature = "ollama")]`
      # branches (e.g. in src/ops/mod.rs). The all-features build above never
      # exercises the pure-ONNX path, so a `--no-default-features` compile break
      # would otherwise ship unnoticed. Cheap `check` only.
      # `--no-default-features` also strips `engram-onnx`'s own default, so a
      # linking strategy has to be named explicitly or the build stops at the
      # "needs an ONNX Runtime linking strategy" compile_error.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features --features onnxruntime,load-dynamic --locked

      # The mirror image of the step above: ONNX compiled out entirely, with
      # Ollama the only embedding backend. `#[cfg(feature = "onnxruntime")]`
      # gates a large surface here (the whole reranker loader, NLI, T5), and no
      # other CI job builds the crate without it, so that surface had no
      # compile coverage at all. It was in fact broken when this step was
      # added: a doc comment inserted between `resolve_reranker_model`'s
      # `#[cfg]` and the function itself moved the gate onto its new neighbour,
      # leaving `RerankerModel` — a `fastembed` type that does not exist in
      # this configuration — referenced unconditionally.
      #
      # `load-dynamic` is named explicitly for the same reason as above:
      # `--no-default-features` also strips `engram-onnx`'s own default, and it
      # is a workspace member, so `--workspace` checks it even though nothing
      # depends on it once `onnxruntime` is off.
      - name: Check (Ollama only, ONNX compiled out)
        run: cargo check --workspace --no-default-features --features ollama,load-dynamic --locked

  # Linux full tests run in the `test` job below; this matrix covers the
  # non-Linux targets that `release.yml` actually ships (macOS + Windows):
  # a full-workspace build so every platform-gated line compiles on every PR,
  # plus a small filtered nextest subset so the platform-divergent
  # IPC/filesystem code — most importantly the Windows named-pipe daemon
  # transport (`#[cfg(windows)]` in src/daemon/transport.rs) vs the
  # `#[cfg(unix)]` Unix-socket path, path resolution, and the advisory write
  # lock — is actually EXECUTED off Linux instead of first failing at release
  # time. The subset must stay model-free: no ONNX models are staged on these
  # runners, so any model-loading test would fail here.
  check-cross:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install nextest
        # Prebuilt binary, same rationale as the `test` job below.
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      # There used to be a `cargo check --workspace --all-features` step here.
      # It was pure overhead (median ~4 min per OS, measured): the test build
      # below compiles every lib and bin target of every workspace crate with
      # full codegen (the integration tests link the libs and spawn the
      # binary), which type-checks strictly more than `check` did, and `check`
      # shares only build scripts and proc-macros with that build (its
      # dependency artifacts are rmeta-only and get rebuilt). Everything is
      # compiled exactly once now, in the step below; it is split out from the
      # run only so the step timings show build and test separately.
      - name: Build (full workspace, all features)
        # ONNX Runtime is downloaded + statically linked by fastembed's
        # `download-binaries` (same as release.yml), so no manual ORT setup.
        run: cargo nextest run --workspace --all-features --locked --no-run

      - name: Test platform-gated IPC and filesystem code
        # `daemon::transport` exercises the Unix-socket/named-pipe transports
        # (bind/yield/reclaim/permissions), `paths::tests` the platform dir
        # resolution, `write_lock::tests` the fs4 advisory-lock semantics,
        # `volume::` the unplugged-drive check (its Windows tests exist only
        # here), `state_file::` / `registry::` / `harvest_state::` the
        # O_NOFOLLOW opens and the files they guard, `layout::tests::` that
        # the pinned layout digests hold on every target, `engram-onnx` the
        # runtime search order (its Windows/macOS cwd test runs nowhere
        # else), `daemon::client::` the spawn command and environment, and
        # `daemon::tests::` the daemon end to end. The concurrency test is
        # the cross-process write lock. Everything here uses only temp dirs —
        # no models, no network (see the job comment above before adding
        # filters). The two daemon tests that load the real embedding model
        # are excluded by exact name; never exclude a module wholesale: a
        # test that fails off Linux is either a platform defect (report it,
        # then exclude that one test by exact name with a comment linking the
        # report) or a test assumption to fix.
        run: >-
          cargo nextest run --workspace --all-features --locked
          -E 'test(daemon::transport) + test(paths::tests) + test(write_lock::tests)
          + test(volume::) + test(state_file::) + test(registry::) + test(harvest_state::)
          + test(layout::tests::) + package(engram-onnx) + test(daemon::client::)
          + (test(daemon::tests::)
             - test(=daemon::tests::daemon_loads_the_bundle_named_by_the_request_not_by_dir)
             - test(=daemon::tests::remote_embedding_end_to_end))
          + test(=concurrency::concurrent_adds_from_separate_processes_all_persist)'

      - name: Test the CLI snapshots (macOS)
        # Tier 2 spawns the binary; its fixture already forces offline mode
        # and an empty model cache, so it is model-free. A difference here
        # (`/private/var`, a path separator) is a redaction gap to fix in
        # `snapshot/mod.rs::normalize`, never a platform-specific snapshot.
        if: runner.os == 'macOS'
        run: >-
          cargo nextest run --workspace --all-features --locked
          -E 'binary(cli) & test(snapshot::)'

      - name: Upload the JUnit report
        # `if: always()`: the report matters most when a test failed or was
        # killed by the slow-test limit.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-cross-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

  # Build once, run sharded. The suite is ~26 CPU-minutes of test time that
  # nextest already spreads across all 4 cores of one runner (~6.8 min wall,
  # measured), so it is CPU-bound and splits almost linearly across runners.
  # `test-build` compiles every test binary exactly once and packs them with
  # `cargo nextest archive`; each `test` shard downloads that archive and runs a
  # third of the tests with no Rust build (and no rust-cache restore) at all.
  #
  # Things the archive has to carry, and does:
  #   - the `engramdb` binary the tier-2 CLI tests spawn: nextest archives the
  #     workspace's bin targets and sets `CARGO_BIN_EXE_engramdb` at run time,
  #     which is the first place `assert_cmd::Command::cargo_bin` looks;
  #   - fixtures and insta snapshots: those are read from the source tree, and
  #     every shard checks out the same commit at the same path, which
  #     `--workspace-remap` points the archived binaries at;
  #   - `.config/nextest.toml`: read from that checkout too, so the
  #     `ml-models` group keeps `max-threads = 1` within every shard.
  # ONNX models come from the shared model cache (restored, never saved,
  # here); anything it lacks is downloaded at run time exactly as before.
  test-build:
    name: Test (build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install nextest
        # Use the prebuilt binary instead of `cargo install cargo-nextest`,
        # which compiles nextest from source (~7 min on a cache miss). This
        # downloads a prebuilt release in seconds, every run, regardless of
        # cache state.
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Build and archive the test binaries
        run: >-
          cargo nextest archive --workspace --all-features --locked
          --archive-file nextest-all-features.tar.zst

      - name: Upload the test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-all-features
          path: nextest-all-features.tar.zst
          # Already zstd: re-deflating it costs time and saves nothing.
          # Measured (run 41599658093): `nextest archive` packs 536 files in
          # 5.3 s, the 571 MB upload takes 8 s, a shard's download 6-39 s and
          # nextest's extraction ~6 s. That is under a minute of a ~3 min
          # shard, so the archive is not worth splitting or recompressing.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # nextest does not run doctests, so no job ever compiled an example in
      # a doc comment: one that no longer matches the API it documents stayed
      # wrong. Here because the dependencies are already built in this
      # profile. The shards wait for this job, so this step's time is added to
      # every run; if that turns out to be minutes, move it to its own job.
      #
      # NOT BLOCKING YET (`continue-on-error`): doctests have never run in CI
      # or in the sandbox this step was written in, so whether today's tree
      # passes is unknown, and a required job must not be shipped red. A
      # failure shows as an annotation on the run. Remove `continue-on-error`
      # after the first green run of this step; if it is slow because each
      # example links the LanceDB stack, mark the heavy ones `no_run` (they
      # still compile) rather than dropping the step.
      - name: Doctests (not blocking yet)
        continue-on-error: true
        run: cargo test --doc --workspace --all-features --locked

  test:
    name: Test (shard ${{ matrix.shard }}/3)
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A model-backed test fails with the load error instead of passing by
    # skipping (engram-test-support's `require_model!`). Only on the jobs that
    # install a runtime and restore the model cache.
    env:
      ENGRAMDB_TEST_REQUIRE_MODELS: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Nothing is compiled here; the toolchain is only what `cargo nextest`
        # is dispatched through.
        run: rustup toolchain install

      - name: Install nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Install ONNX Runtime
        # `--all-features` enables `load-dynamic` alongside `bundled-onnxruntime`,
        # and `ort` takes the dlopen path whenever `load-dynamic` is on — so a
        # real shared library has to be present even though a static one is also
        # linked in. Before the runtime became external, the static link alone
        # was enough here.
        #
        # The version and its SHA-256 live in the action, once.
        uses: ./.github/actions/install-onnxruntime

      - name: Restore the ONNX model cache
        # Saved by the `coverage` job (see there); restore-only here, so three
        # shards never race to save it.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/engramdb/models
          key: onnx-models-v1-${{ hashFiles('crates/engram-models/src/embeddings/onnx.rs', 'crates/engram-models/src/nli/onnx.rs', 'crates/engram-models/src/title/t5.rs', 'crates/engram-models/src/rerank.rs') }}
          restore-keys: onnx-models-v1-

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-all-features

      - name: Stage the models
        # One process loads (and, on a cache miss, downloads) every model the
        # suite loads, before the suite: no two test processes download the
        # same files at once, and a missing model fails here, named.
        run: >-
          cargo nextest run
          --archive-file nextest-all-features.tar.zst
          --workspace-remap "${{ github.workspace }}"
          --run-ignored only -E 'test(=staging::stage_default_models)'

      - name: Run tests (shard ${{ matrix.shard }}/3)
        # `count:` deals each binary's tests round-robin across the shards, so
        # every shard gets a third of the slow tier-2 CLI binary rather than
        # one shard getting all of it.
        run: >-
          cargo nextest run
          --archive-file nextest-all-features.tar.zst
          --workspace-remap "${{ github.workspace }}"
          --partition count:${{ matrix.shard }}/3

      - name: Upload the JUnit report
        # `if: always()`: the report matters most when a test failed or was
        # killed by the slow-test limit.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-all-features-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

  # `ops::compress::dot_unit` is `fearless_simd`, whose `dispatch!` normalises
  # *up* to the best SIMD level the CPU supports and offers no runtime way down.
  # Every runner here has AVX2 or better, so without this job the SSE2 and
  # SSE4.2 kernels would be compiled, shipped, and never once executed by the
  # suite — and SSE2 is what every pre-Haswell CPU and every AVX2-masking VM
  # runs. The hand-written backends this replaced could be called directly, so
  # one run covered them all; that guarantee now costs a build per level.
  #
  # `--cfg disable_dispatch_*` is fearless_simd's own supported knob. Scoped to
  # the arithmetic tests, and to `-p engramdb --lib`, so it stays a couple of
  # minutes rather than a full matrix of the workspace.
  simd-levels:
    name: SIMD kernel at every dispatch level
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: avx2
            flags: "--cfg disable_dispatch_avx512"
          - level: sse4.2
            flags: "--cfg disable_dispatch_avx512 --cfg disable_dispatch_avx2"
          - level: sse2
            flags: "--cfg disable_dispatch_avx512 --cfg disable_dispatch_avx2 --cfg disable_dispatch_sse4_2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: simd-${{ matrix.level }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Run the SIMD kernel tests forced to ${{ matrix.level }}
        env:
          # `-C link-arg=-fuse-ld=lld` is repeated from `.cargo/config.toml`
          # deliberately: setting the RUSTFLAGS *env var* makes cargo ignore the
          # `[target.*] rustflags` in that file entirely (the sources are
          # mutually exclusive, not additive), so without it this job installs
          # lld and then silently links all three legs with BFD.
          RUSTFLAGS: ${{ matrix.flags }} -C link-arg=-fuse-ld=lld
        run: |
          cargo nextest run -p engramdb --lib --locked \
            -E 'test(ops::compress::tests::dot_unit) + test(ops::compress::tests::similar_pairs)'

      - name: Upload the JUnit report
        # `if: always()`: the report matters most when a test failed or was
        # killed by the slow-test limit.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-simd-${{ matrix.level }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

  # `--all-features` necessarily turns `bundled-onnxruntime` back on, so the job
  # above links ONNX Runtime statically and never exercises what users actually
  # ship: default features, where the runtime is `dlopen`ed at run time. This job
  # covers that path. The case that used to abort the process, a *missing*
  # runtime that must degrade to "embeddings unavailable" instead, is guarded by
  # the `missing-runtime` job below, against a binary built with
  # `panic = "abort"`; this job only runs the probe's own unit tests.
  #
  # Split the same way as `test` (build once, three shards), and for the same
  # reason: this was the slowest Linux job (median 14.3 min: ~6 min build,
  # ~1.2 min test-target build, ~6.5 min of tests). The build-only assertions
  # (ldd, start-up, the runtime probe's unit tests) stay in the build job, which
  # deliberately never installs a runtime — so "must start with no runtime
  # installed" now really runs with none, rather than with the one the old
  # single job had already put in /usr/local/lib for its test step.
  test-load-dynamic-build:
    name: Test (default features, runtime-loaded ONNX) (build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Build with default features
        # No ONNX Runtime is required to build under `load-dynamic`; this must
        # succeed on its own.
        run: cargo build --workspace --locked

      - name: Binary must not record a load-time dependency on ONNX Runtime
        # The property that makes graceful degradation possible at all. If
        # libonnxruntime becomes a DT_NEEDED entry, the dynamic loader resolves
        # it before `main()` runs, and a missing runtime stops the binary from
        # starting -- no `doctor`, no fallback, and the pre-flight probe never
        # gets a turn. Switching a strategy feature into `default` would cause
        # exactly that, silently.
        run: |
          if ldd target/debug/engramdb | grep -qi onnxruntime; then
            echo "::error::engramdb links libonnxruntime at load time; the default \
          build must resolve it at run time so a missing runtime degrades instead \
          of blocking startup."
            ldd target/debug/engramdb | grep -i onnxruntime
            exit 1
          fi
          echo "OK: no load-time ONNX Runtime dependency recorded."

      - name: Binary must start with no runtime installed
        run: ./target/debug/engramdb --version

      - name: Build and archive the test binaries
        run: >-
          cargo nextest archive --workspace --locked
          --archive-file nextest-default-features.tar.zst

      - name: The runtime probe's unit tests, with no runtime installed
        # Unit tests of `engram_onnx::runtime` only. Whether a missing runtime
        # really degrades instead of aborting is the `missing-runtime` job's
        # question: this profile unwinds, so a loader that skipped the probe
        # would not abort here. (This step used to end with
        # `cargo run ... doctor || true`, which could not fail on anything.)
        # No runtime was ever installed on this runner, so nothing to remove.
        run: |
          if ldconfig -p | grep -qi onnxruntime; then
            echo "::error::an ONNX Runtime is installed on this runner; the missing-runtime checks would not test anything."
            exit 1
          fi
          cargo nextest run --workspace --locked -E 'test(runtime::tests::)'

      - name: Upload the test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-default-features
          path: nextest-default-features.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # What the `frontend-browser` job needs: the debug binary built above and
      # the generator of the deterministic dashboard stores (an example of the
      # core crate; model-free). Built here because this job already has every
      # dependency compiled in this profile. The three steps are
      # `continue-on-error`: `frontend-browser` is not a required job yet, so
      # nothing it needs may fail this one, which is required. If they fail,
      # `frontend-browser` fails at its download step and says why.
      - name: Build the dashboard store generator
        continue-on-error: true
        run: cargo build --locked -p engramdb --example dashboard_bench_store

      - name: Pack the binary and the generator for the browser checks
        continue-on-error: true
        # A tarball, because upload-artifact drops the executable bit.
        run: >-
          tar -C target/debug -cf dashboard-browser-bins.tar
          engramdb examples/dashboard_bench_store

      - name: Upload them
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-bins
          path: dashboard-browser-bins.tar
          retention-days: 1
          if-no-files-found: warn

  # The regression guard for "a missing ONNX Runtime degrades, it does not kill
  # the process". Under `load-dynamic`, `ort`'s own loader panics when the
  # library is absent, and the shipped profile is `panic = "abort"`, so every
  # model loader has to call `ensure_onnx_runtime()` before it touches `ort`.
  # A loader that forgets passes every other job here: the dev profile
  # unwinds, and a panic inside `spawn_blocking` comes back as a `JoinError`
  # the caller turns into the fallback. Users then get SIGABRT.
  #
  # So this job builds the binary with the dev profile plus `panic = "abort"`
  # (the property under test is the panic strategy; a real release build would
  # add many minutes of LTO for nothing) and runs
  # .github/scripts/smoke-no-runtime.sh, which drives every command that loads
  # a model, with NLI, the reranker and T5 all enabled, and fails on any exit
  # code a command is not allowed. release.yml runs the same script against
  # each real release binary.
  #
  # The model cache is restored so the models are present and the runtime is
  # the only missing thing: the loaders check "is the model cached" right
  # after the runtime probe, so with an empty cache a loader that skipped the
  # probe would fail at the download instead of reaching `ort`. (On a cold
  # cache the script still passes; it is then a weaker test.)
  #
  # Its own job, not a step of `test-load-dynamic-build`: the abort build
  # recompiles every crate (the panic strategy is part of each crate's
  # codegen), so it gets its own runner disk and its own rust-cache entry
  # (`key: abort`). If the 10 GB cache quota becomes a problem again, set
  # `save-if: false` here first and accept a cold build.
  missing-runtime:
    name: Missing ONNX Runtime degrades, never aborts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: abort
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Restore the ONNX model cache
        # Saved by the `coverage` job (see there); restore-only here.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/engramdb/models
          key: onnx-models-v1-${{ hashFiles('crates/engram-models/src/embeddings/onnx.rs', 'crates/engram-models/src/nli/onnx.rs', 'crates/engram-models/src/title/t5.rs', 'crates/engram-models/src/rerank.rs') }}
          restore-keys: onnx-models-v1-

      - name: No ONNX Runtime may be installed on this runner
        run: |
          if ldconfig -p | grep -qi onnxruntime; then
            echo "::error::an ONNX Runtime is installed on this runner; the missing-runtime checks would not test anything."
            exit 1
          fi
          if [ -n "${ORT_DYLIB_PATH:-}" ]; then
            echo "::error::ORT_DYLIB_PATH is set; the missing-runtime checks would not test anything."
            exit 1
          fi
          echo "OK: no ONNX Runtime on this runner."

      - name: Build the binary with panic = "abort"
        env:
          # The dev profile with the release profile's panic strategy. Same as
          # `--config 'profile.dev.panic="abort"'`.
          CARGO_PROFILE_DEV_PANIC: abort
        run: cargo build --locked --bin engramdb

      - name: Every model-loading command must survive a missing runtime
        run: bash .github/scripts/smoke-no-runtime.sh target/debug/engramdb --require-missing-runtime

  # The dashboard's interaction and accessibility checks in a real browser
  # (crates/engram-dashboard/bench/browser/checks.mjs): the accessible list,
  # keyboard walk, hover hit testing, click, relation pin, display filters,
  # zoom and pan, theme switch, far-scope tags, and "no console error", for
  # both drawing surfaces (Plain on canvas, Grid on SVG). Nothing else in CI
  # runs the frontend; the Rust tests read it as text.
  #
  # NOT REQUIRED YET, on purpose: this job is not in `ci-result.needs`, so a
  # failure here shows as a failed check but does not fail `CI result`. The
  # pixel comparisons have only been run on developer machines (they pass
  # there with a debug binary and Chrome); whether they hold under this
  # runner's software rasteriser and Chrome version is what the first runs
  # will show. After ten consecutive green master runs, add `frontend-browser`
  # to `ci-result.needs` (one line) and delete this paragraph. If a pixel
  # check is unstable here, fix its tolerance in checks.mjs with the
  # measurement recorded in bench/browser/README.md; do not delete the check.
  #
  # No browser download: the runner image ships Google Chrome, and the driver
  # is `playwright-core`, pinned with a lockfile in bench/browser. Stores are
  # generated in this job (not shipped from the build job) because a store's
  # id is derived from its absolute path.
  frontend-browser:
    name: Frontend (headless browser checks, not required yet)
    needs: test-load-dynamic-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the binary and the store generator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-browser-bins

      - name: Generate the dashboard stores (60 and 1,000 memories, the fault fixture)
        # Deterministic `.md` files plus one reindex; no model, no network.
        # 1,000 is above the overview threshold (150), so the opened-scope
        # checks run without the 10k store. `sfault` (with its `sfault-away`
        # sibling) is the non-graph pages' fixture: challenged and
        # invalidated memories, proposed relations, a NaN criticality, a
        # merge-conflicted file (examples/support/dashboard_store.rs).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bins"
          tar -C "$RUNNER_TEMP/bins" -xf dashboard-browser-bins.tar
          "$RUNNER_TEMP/bins/examples/dashboard_bench_store" "$RUNNER_TEMP/dash-bench" s60 s1k sfault

      - name: Install the pinned Playwright driver
        working-directory: crates/engram-dashboard/bench/browser
        # `--ignore-scripts`: playwright-core needs no install script, and a
        # lockfile-pinned dependency should not get to run one here.
        run: npm ci --ignore-scripts

      - name: Run the browser checks
        working-directory: crates/engram-dashboard
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$chrome" ]; then
            echo "::error::no Google Chrome on this runner image; install one or pass a Chromium path"
            exit 1
          fi
          "$chrome" --version
          node bench/browser/checks.mjs \
            --stores "$RUNNER_TEMP/dash-bench" \
            --bin "$RUNNER_TEMP/bins/engramdb" \
            --chrome "$chrome" \
            --views s60:full,s1k:all,s1k:open \
            --dump-dir "$RUNNER_TEMP/browser-dump" \
            --json "$RUNNER_TEMP/browser-checks.json"

      - name: Run the page checks
        # bench/browser/pages.mjs: Overview, Memories, Health, Relations and
        # the review flow on `sfault`, with one read-only and one
        # `--allow-writes` dashboard it starts itself.
        if: always()
        working-directory: crates/engram-dashboard
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          node bench/browser/pages.mjs \
            --stores "$RUNNER_TEMP/dash-bench" \
            --bin "$RUNNER_TEMP/bins/engramdb" \
            --chrome "$chrome" \
            --json "$RUNNER_TEMP/browser-pages.json"

      - name: Upload the check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks
          path: |
            ${{ runner.temp }}/browser-checks.json
            ${{ runner.temp }}/browser-pages.json
            ${{ runner.temp }}/browser-dump/
          retention-days: 7
          if-no-files-found: warn

  test-load-dynamic:
    name: Test (default features, runtime-loaded ONNX) (shard ${{ matrix.shard }}/3)
    needs: test-load-dynamic-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A model-backed test fails with the load error instead of passing by
    # skipping (engram-test-support's `require_model!`). Only on the jobs that
    # install a runtime and restore the model cache.
    env:
      ENGRAMDB_TEST_REQUIRE_MODELS: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Install ONNX Runtime
        # The official Microsoft build. Deliberately not the one `ort` would
        # download: that prebuilt executes quantized models incorrectly on
        # AVX-512/AMX hosts. See docs/contributors/embedding-model-alternatives.md.
        #
        # The version and its SHA-256 live in the action, once.
        uses: ./.github/actions/install-onnxruntime

      - name: Restore the ONNX model cache
        # Saved by the `coverage` job (see there); restore-only here, so three
        # shards never race to save it.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/engramdb/models
          key: onnx-models-v1-${{ hashFiles('crates/engram-models/src/embeddings/onnx.rs', 'crates/engram-models/src/nli/onnx.rs', 'crates/engram-models/src/title/t5.rs', 'crates/engram-models/src/rerank.rs') }}
          restore-keys: onnx-models-v1-

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-default-features

      - name: Stage the models
        # One process loads (and, on a cache miss, downloads) every model the
        # suite loads, before the suite: no two test processes download the
        # same files at once, and a missing model fails here, named.
        run: >-
          cargo nextest run
          --archive-file nextest-default-features.tar.zst
          --workspace-remap "${{ github.workspace }}"
          --run-ignored only -E 'test(=staging::stage_default_models)'

      - name: Test with the runtime discovered from /usr/local/lib (shard ${{ matrix.shard }}/3)
        # No ORT_DYLIB_PATH: this asserts the built-in search path finds a
        # system-installed runtime the way a Homebrew or distro install would.
        run: >-
          cargo nextest run
          --archive-file nextest-default-features.tar.zst
          --workspace-remap "${{ github.workspace }}"
          --partition count:${{ matrix.shard }}/3

      - name: Upload the JUnit report
        # `if: always()`: the report matters most when a test failed or was
        # killed by the slow-test limit.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-default-features-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # `llvm-tools-preview` ships `llvm-profdata`/`llvm-cov`, which
        # cargo-llvm-cov shells out to for instrumentation-based coverage.
        # `rustup component add` applies to the toolchain rust-toolchain.toml
        # names, since that is the active one in this directory.
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install nextest and cargo-llvm-cov
        # Prebuilt binaries (same rationale as the test job): avoids a
        # ~7 min from-source compile of each tool on a cache miss.
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest,cargo-llvm-cov

      - name: Install ONNX Runtime
        # `--all-features` enables `load-dynamic` alongside `bundled-onnxruntime`,
        # and `ort` takes the dlopen path whenever `load-dynamic` is on — so a
        # real shared library has to be present even though a static one is also
        # linked in. Before the runtime became external, the static link alone
        # was enough here.
        #
        # The version and its SHA-256 live in the action, once.
        uses: ./.github/actions/install-onnxruntime

      # The HuggingFace models the suite loads (embedding, T5, NLI, reranker)
      # live in `model_cache_dir()` = ~/.cache/engramdb/models. Without a
      # cache, all seven test jobs of a run (two suites x three shards, plus
      # this one) download them from HuggingFace anonymously, ~7x per run:
      # seconds each, but a rate limit or an HF outage fails the run.
      #
      # This job is the one that saves it, because it is the only one that
      # runs the *whole* suite in one place, so it is the only one guaranteed
      # to have touched every model a test loads (a shard sees a third of the
      # tests, and would save a third of the models under a key nothing ever
      # refreshes). It saves on master only, like every other cache here.
      #
      # Keyed on the files that name the model repos and files. Editing one
      # restores the previous set through `restore-keys` and downloads only
      # the difference; the union is saved under the new key. Bump `v1` to
      # drop models no spec names any more. Not keyed on Cargo.lock: a
      # fastembed bump that changes a registry model's files just downloads
      # that model at run time, rather than writing a new entry every week.
      - name: Restore the ONNX model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/engramdb/models
          key: onnx-models-v1-${{ hashFiles('crates/engram-models/src/embeddings/onnx.rs', 'crates/engram-models/src/nli/onnx.rs', 'crates/engram-models/src/title/t5.rs', 'crates/engram-models/src/rerank.rs') }}
          restore-keys: onnx-models-v1-

      - name: Stage the models
        # See the `test` job. The cache this job saves on master is the one
        # the staging step filled.
        env:
          ENGRAMDB_TEST_REQUIRE_MODELS: "1"
        run: >-
          cargo llvm-cov nextest -p engram-models --all-features --locked --no-report
          --run-ignored only -E 'test(=staging::stage_default_models)'

      - name: Run tests under coverage instrumentation
        # Mirror the `test` job's invocation so coverage reflects the real
        # suite. `--no-report` defers report generation so we can emit
        # multiple formats from the one profdata set below.
        env:
          # insta appends the path of every snapshot file an assertion
          # touches (the mechanism behind `cargo insta test --unreferenced`).
          # Read by the "unreferenced snapshots" step below. Set on this job
          # because it is the only one that runs the whole suite unsharded.
          INSTA_SNAPSHOT_REFERENCES_FILE: ${{ runner.temp }}/insta-snapshot-references.txt
          ENGRAMDB_TEST_REQUIRE_MODELS: "1"
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report

      # A snapshot whose test was renamed or deleted still looks like a pinned
      # contract and pins nothing. See the script's header.
      #
      # NOT BLOCKING YET (`continue-on-error`): this comparison has never run,
      # so the tree may hold dead snapshots today, and it is not yet confirmed
      # that the references file is written under `cargo llvm-cov nextest`.
      # A failure shows as annotations naming each file. After the first green
      # run of this step, remove `continue-on-error`.
      - name: Every committed snapshot was asserted by a test (not blocking yet)
        continue-on-error: true
        env:
          REFS: ${{ runner.temp }}/insta-snapshot-references.txt
        run: bash .github/scripts/check_unreferenced_snapshots.sh "$REFS"

      - name: Upload the JUnit report
        # `if: always()`: the report matters most when a test failed or was
        # killed by the slow-test limit.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-coverage
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report the ONNX model cache
        run: |
          du -sh ~/.cache/engramdb/models/models--*/ 2>/dev/null | sort -h || true
          du -sh ~/.cache/engramdb/models 2>/dev/null || echo "no model cache"

      - name: Save the ONNX model cache
        # Only after a green run: a test that falls back when a download fails
        # could otherwise leave a model out of the saved set.
        if: github.ref == 'refs/heads/master' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/engramdb/models
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Generate coverage reports
        # Exclude integration-test harness files and the test-isolation crate
        # from the denominator so the percentage tracks production code.
        #
        # No `--fail-under-lines` floor, deliberately, for now. The lcov
        # artifacts of recent runs list only the core crate's files (52 files
        # under src/, none under crates/), about 94.5 % of their lines. A
        # floor on that figure would guard 52 of about 190 source files and
        # read as if it guarded all of them. First make the report cover the workspace
        # (confirm what these two `report` calls need for that), read the
        # real figure from a master run, then add a floor a couple of points
        # under it.
        env:
          IGNORE: '(/tests?/|test_support|engram-test-support|/benches/|/examples/|/fuzz/)'
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$IGNORE"
          {
            echo '## Coverage summary'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  # One stable check name for branch protection. Required checks match job
  # names exactly, and the matrix/shard names here change whenever a job is
  # split or a shard count moves (`Test` became `Test (shard N/3)`), which
  # silently drops a required check: a rule naming a job that no longer runs
  # waits forever, or is removed and protects nothing. Require `CI result`
  # instead and this job carries every other job's verdict.
  #
  # `if: always()` so it reports even when a dependency failed; without it a
  # failed `needs` would skip this job, and GitHub counts a skipped required
  # check as passing. Anything other than success (failure, cancelled, or a
  # shard skipped because its build failed) fails it.
  #
  # Every job in this file is listed below, with one declared exception:
  # `frontend-browser`, which is informational until it has proven stable on
  # this runner (see its comment). A new job belongs in this list unless it
  # says, like that one, why not.
  ci-result:
    name: CI result
    if: always()
    needs:
      - manifest-version
      - fuzz-lockfile-parity
      - fuzz-check
      - formatter-output
      - frontend
      - deny
      - check
      - check-cross
      - test-build
      - test
      - simd-levels
      - test-load-dynamic-build
      - missing-runtime
      - test-load-dynamic
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::not successful: $failed"
            exit 1
          fi
