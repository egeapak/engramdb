name: Fuzz

# Fuzzing links the whole crate (lancedb/ort native deps) and needs a nightly
# toolchain, so it runs on a schedule and on demand rather than on every PR.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

permissions:
  contents: read
  # Needed by the issue-on-failure step below.
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build every target once and hand the binaries to the run legs. Each leg
  # used to compile the whole crate graph (LanceDB, DataFusion, Arrow, ORT)
  # itself, ASan-instrumented: 26 min per leg when it worked (run #18), and
  # nine legs racing to run out of memory when it did not (#19 on). The
  # binaries are ~all the same dependency graph, so one build costs about what
  # one leg's did.
  build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      # Registry and git sources only, no build output: a full `fuzz/target`
      # (ASan-instrumented nightly deps, multiple GB) would land in the 10 GB
      # repo quota CI's caches live in and evict them, and a weekly run on a
      # new nightly would barely reuse it anyway. Saved from master only.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build all targets
        # A runner that runs out of memory (or disk) is shut down mid-step
        # with exit 143 and no error from the build itself, so print both
        # once a minute: the last sample before a kill names the resource.
        # Measured peak with fuzz/Cargo.toml's profile is 13 GB at 4 jobs;
        # 3 leaves headroom on a 16 GB runner for a few minutes' cost.
        env:
          CARGO_BUILD_JOBS: 3
        run: |
          (
            while sleep 60; do
              echo "[resources] $(date -u +%H:%M:%S)" \
                "mem used/total MiB: $(free -m | awk '/^Mem:/{print $3"/"$2}')" \
                "swap used MiB: $(free -m | awk '/^Swap:/{print $3}')" \
                "disk free /: $(df -h --output=avail / | tail -1 | tr -d ' ')"
            done
          ) &
          sampler=$!
          cargo +nightly fuzz build
          kill "$sampler" || true
          free -m
          df -h /
          du -sh fuzz/target

      - name: Package binaries
        # upload-artifact drops the executable bit, so ship a tarball.
        run: |
          bin=fuzz/target/x86_64-unknown-linux-gnu/release
          targets=$(cargo +nightly fuzz list)
          tar -C "$bin" -czf fuzz-bins.tar.gz $targets
          ls -l fuzz-bins.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: fuzz-bins
          path: fuzz-bins.tar.gz
          retention-days: 3
          if-no-files-found: error

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - memory_file
          - memory_file_roundtrip
          - scope_logical
          - scope_physical
          - scope_proximity
          - decay
          - composite_score
          - registry
          - slug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fuzz-bins

      - name: Unpack ${{ matrix.target }}
        run: mkdir -p bins && tar -C bins -xzf fuzz-bins.tar.gz ${{ matrix.target }}

      - name: Restore fuzz corpus
        # The corpus grows as libfuzzer discovers new coverage; persist it
        # across weekly runs so each run resumes from accumulated coverage
        # instead of restarting from the curated seeds in git. Caches are
        # immutable, so key on run_id to save a fresh snapshot every run and
        # let restore-keys pick up the most recent previous one.
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run ${{ matrix.target }}
        # What `cargo fuzz run <t>` executes once its build is up to date:
        # the same artifact prefix, corpus directory and ASAN_OPTIONS.
        env:
          ASAN_OPTIONS: detect_odr_violation=0
        run: |
          t=${{ matrix.target }}
          mkdir -p "fuzz/artifacts/$t" "fuzz/corpus/$t"
          "./bins/$t" -artifact_prefix="fuzz/artifacts/$t/" \
            -max_total_time=${{ github.event.inputs.max_total_time || '300' }} \
            "fuzz/corpus/$t"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

      - name: File or update fuzz-failure issue
        # Scheduled runs have no human watching them; route failures to an
        # issue so a crash found on a Monday run isn't silently forgotten.
        # One open issue per target: repeat failures append a comment.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const target = '${{ matrix.target }}';
            const label = 'fuzz-failure';
            const title = `Fuzz failure: ${target}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled fuzz run failed for target \`${target}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Crash inputs (if any) are in the run\'s `fuzz-artifacts-' + target + '` artifact.',
              'Reproduce locally with:',
              '```',
              `cargo +nightly fuzz run ${target} fuzz/artifacts/${target}/<crash-file>`,
              '```',
              'Per fuzz/ policy, commit the failing input as a corpus seed once fixed.',
            ].join('\n');
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'A scheduled fuzz run found a failure',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = label already exists
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
            }
