name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# No archive contains an ONNX Runtime — not statically linked, not shipped
# alongside. Every binary resolves one at startup from the user's system, and
# EngramDB never carries its own copy. Three reasons:
#   * the prebuilt `ort` downloads and statically links executes quantized
#     models incorrectly on AVX-512/AMX hosts, so the copy we would ship is the
#     one we cannot trust — see docs/contributors/embedding-model-alternatives.md
#     (R6/R9);
#   * a bundled runtime cannot be patched by whoever maintains the rest of the
#     machine, and silently wins over the package manager's copy because the
#     search checks the executable's directory first;
#   * shipping it for some targets and not others is worse than not shipping it
#     at all — there is no official x86_64 macOS build past 1.23.x, so Intel Mac
#     could never have had one, and Homebrew's is not redistributable standalone
#     (it links abseil / onnx / protobuf / re2).
#
# Users install it once (`brew install onnxruntime`, `scoop install onnxruntime`,
# a distro package, or `ORT_DYLIB_PATH`). Any version providing C API 24 works,
# i.e. ONNX Runtime >= 1.24. Until one is present EngramDB still runs: `doctor`
# reports what is missing and search falls back to keyword matching.

jobs:
  # Gate the whole release on version consistency: the pushed tag (v0.7.0), the
  # plugin manifest, the marketplace manifest, and the workspace version in
  # Cargo.toml (what `engramdb --version` actually reports) must all agree.
  # Catches a tag/manifest/binary drift before any binary is built or published.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches manifest and workspace versions
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          plugin_ver=$(jq -r '.version' .claude-plugin/plugin.json)
          market_ver=$(jq -r '.plugins[] | select(.name == "engram") | .version' .claude-plugin/marketplace.json)
          # [workspace.package] version is the single source of truth every
          # crate inherits (version.workspace = true); grep it out of the raw
          # TOML so this job stays toolchain-free.
          cargo_ver=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "tag:              $tag_ver"
          echo "plugin.json:      $plugin_ver"
          echo "marketplace.json: $market_ver"
          echo "Cargo.toml:       $cargo_ver"
          fail=0
          [ "$plugin_ver" = "$tag_ver" ] || { echo "::error::plugin.json ($plugin_ver) != tag ($tag_ver)"; fail=1; }
          [ "$market_ver" = "$tag_ver" ] || { echo "::error::marketplace.json ($market_ver) != tag ($tag_ver)"; fail=1; }
          [ "$cargo_ver" = "$tag_ver" ] || { echo "::error::Cargo.toml [workspace.package] version ($cargo_ver) != tag ($tag_ver)"; fail=1; }
          exit $fail

  # Release binaries must come from a commit the test suite passed on: a tag
  # can point at any commit (including one that never went through a PR), so
  # run the same suite CI runs (see ci.yml `test`) before any build starts.
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Mirror ci.yml: drop debuginfo so the ~8 heavy test binaries stay
      # within the runner's disk, and skip dead-weight incremental state.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Must match ci.yml's pin: the runtime this job installs is the one the
      # model-loading tests dlopen.
      ONNXRUNTIME_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        # Prebuilt binary, same rationale as ci.yml: `cargo install` compiles
        # nextest from source (~7 min on a cache miss).
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install ONNX Runtime
        # Same reason as the identical step in ci.yml's `test` job: `--all-features`
        # enables `load-dynamic` alongside `bundled-onnxruntime`, and `ort` takes the
        # dlopen path whenever `load-dynamic` is on — so a real shared library has to
        # be present even though a static one is also linked in. Without it the
        # model-loading tests (e.g. `stats_embeddings_status_all_minilm_available_via_onnx`)
        # fail and gate the entire release.
        #
        # Microsoft's official build, not the `ort` download: that prebuilt executes
        # quantized models incorrectly on AVX-512/AMX hosts. See
        # docs/contributors/embedding-model-alternatives.md (R6/R9).
        run: |
          curl -sSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          sudo cp "onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so.${ONNXRUNTIME_VERSION}" \
                  /usr/local/lib/libonnxruntime.so
          sudo ldconfig

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked

  build-arm:
    needs: [version-check, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/protobuf
          key: brew-protobuf-macos-15

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # `--bin engramdb` resolves to the `engram-cli` crate via the workspace's
        # `default-members` (the binary is not in the root core-lib package).
        # `--locked` ensures the shipped binary uses exactly the committed
        # Cargo.lock instead of silently re-resolving newer dependency versions.
        # Default features select `load-dynamic`: no ONNX Runtime is needed to
        # build, and none is shipped. The user supplies one at run time.
        run: cargo build --release --bin engramdb --locked

      - name: Package binary
        run: |
          cd target/release
          tar czf ../../engramdb-aarch64-apple-darwin.tar.gz engramdb
          cd ../..
          shasum -a 256 engramdb-aarch64-apple-darwin.tar.gz > engramdb-aarch64-apple-darwin.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: engramdb-aarch64-apple-darwin
          path: |
            engramdb-aarch64-apple-darwin.tar.gz
            engramdb-aarch64-apple-darwin.tar.gz.sha256

  # Intel Mac (`x86_64-apple-darwin`) is now an ordinary build. It used to ship
  # the pure-Rust `tract` backend because no prebuilt ONNX Runtime 1.24+ exists
  # for this target (Microsoft dropped x86_64 macOS after 1.23.x) and the build
  # had to link one. Under `load-dynamic` nothing is linked at build time, so the
  # same default-feature build cross-compiles here like everywhere else.
  #
  # Like every other target, this archive carries no runtime; Intel users install
  # it with `brew install onnxruntime` (which has an Intel bottle). Worth noting
  # that this target *could* not have shipped one even if we wanted to — there is
  # no official x86_64 macOS build past 1.23.x.
  build-intel:
    needs: [version-check, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache Homebrew packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/protobuf
          key: brew-protobuf-macos-15

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add Intel macOS target
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # Default features. `load-dynamic` needs no ONNX Runtime at build time,
        # which is exactly what makes this target buildable without the special
        # casing it used to need.
        run: cargo build --release --bin engramdb --locked --target x86_64-apple-darwin

      - name: Package binary
        run: |
          cd target/x86_64-apple-darwin/release
          tar czf ../../../engramdb-x86_64-apple-darwin.tar.gz engramdb
          cd ../../..
          shasum -a 256 engramdb-x86_64-apple-darwin.tar.gz > engramdb-x86_64-apple-darwin.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: engramdb-x86_64-apple-darwin
          path: |
            engramdb-x86_64-apple-darwin.tar.gz
            engramdb-x86_64-apple-darwin.tar.gz.sha256

  build-linux:
    needs: [version-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf compiler and lld linker
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # `--bin engramdb` resolves via workspace `default-members` (see build-arm).
        # Default features select `load-dynamic`: the runtime is `dlopen`ed at
        # run time from the user's system, not linked in and not shipped.
        run: cargo build --release --bin engramdb --locked

      - name: Package binary
        run: |
          cd target/release
          tar czf ../../engramdb-x86_64-unknown-linux-gnu.tar.gz engramdb
          cd ../..
          sha256sum engramdb-x86_64-unknown-linux-gnu.tar.gz > engramdb-x86_64-unknown-linux-gnu.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: engramdb-x86_64-unknown-linux-gnu
          path: |
            engramdb-x86_64-unknown-linux-gnu.tar.gz
            engramdb-x86_64-unknown-linux-gnu.tar.gz.sha256

  build-windows:
    needs: [version-check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: choco install protoc -y

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # The shared embedding daemon (Unix-domain-socket only) compiles out on
        # Windows via `#[cfg(unix)]`; model inference runs in-process. Default
        # features select `load-dynamic`, so `onnxruntime.dll` is resolved from
        # the user's system at run time. The release profile keeps the main
        # thread under Windows' 1 MiB default stack, so no `/STACK` linker flag
        # is needed.
        run: cargo build --release --bin engramdb --locked

      - name: Package binary
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\engramdb.exe -DestinationPath engramdb-x86_64-pc-windows-msvc.zip
          $hash = (Get-FileHash engramdb-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  engramdb-x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii engramdb-x86_64-pc-windows-msvc.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: engramdb-x86_64-pc-windows-msvc
          path: |
            engramdb-x86_64-pc-windows-msvc.zip
            engramdb-x86_64-pc-windows-msvc.zip.sha256

  release:
    needs: [build-arm, build-intel, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # These archives contain the binary only. Since ONNX Runtime is no
          # longer bundled, an unpacked tarball is not self-sufficient — say so
          # at the top of every release rather than letting people discover it
          # as "why is search keyword-only?".
          body: |
            ### Prerequisite: ONNX Runtime

            EngramDB loads ONNX Runtime at startup instead of bundling it, so
            install it once (any version >= 1.24):

            ```
            brew install onnxruntime          # macOS / Linuxbrew
            scoop install onnxruntime         # Windows
            sudo apt-get install -y libonnxruntime   # where packaged
            ```

            Or point `ORT_DYLIB_PATH` at a library you already have. Installing
            via Homebrew or Scoop pulls it in automatically.

            Without it EngramDB still starts and runs — semantic search falls
            back to keyword matching, and `engramdb doctor` reports what is
            missing and every path it searched.
          files: |
            engramdb-*.tar.gz
            engramdb-*.tar.gz.sha256
            engramdb-*.zip
            engramdb-*.zip.sha256
