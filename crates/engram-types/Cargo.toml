[package]
name = "engram-types"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Core data-model and configuration types for EngramDB"
repository = "https://github.com/egeapak/engramdb"

[lib]
name = "engram_types"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Snowball stemmer for keyword normalization. Only dependencies are serde and
# serde_derive, both already here, so this keeps the crate light. It lives at
# this layer because BOTH the storage write path (which precomputes stems) and
# the core query path must produce byte-identical output — see
# `src/normalize.rs`.
rust-stemmers = "1"
# Inline (no heap) storage for the short stems in `KeywordStems`, which a text
# query parses once per candidate row. Already in the dependency tree.
compact_str = { version = "0.9", features = ["serde"] }
