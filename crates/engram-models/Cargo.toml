[package]
name = "engram-models"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Embedding / NLI / title ONNX model layer for EngramDB"
repository = "https://github.com/egeapak/engramdb"

[lib]
name = "engram_models"
path = "src/lib.rs"

[features]
default = ["onnxruntime", "load-dynamic", "ollama"]
# ONNX Runtime stack (`ort` + `fastembed` + the `engram-onnx` EP wiring). On by
# default. With it OFF (`--no-default-features`), embeddings fall back to
# Ollama and NLI / reranking / T5 titling compile out; keyword titling remains.
onnxruntime = ["dep:fastembed", "dep:ort", "dep:engram-onnx", "dep:tokenizers", "dep:hf-hub", "dep:ndarray"]
# Ollama embedding backend via `reqwest`. Disable for pure offline ONNX.
ollama = ["reqwest"]
# ORT execution-provider flags, forwarded to engram-onnx + ort. Imply the
# `onnxruntime` stack they configure.
coreml = ["onnxruntime", "ort/coreml", "engram-onnx/coreml"]
xnnpack = ["onnxruntime", "ort/xnnpack", "engram-onnx/xnnpack"]
# --- ONNX Runtime linking strategy; see the workspace root for the rationale. ---
load-dynamic = ["fastembed?/ort-load-dynamic", "ort?/load-dynamic", "engram-onnx?/load-dynamic"]
bundled-onnxruntime = ["fastembed?/ort-download-binaries-rustls-tls", "ort?/download-binaries", "engram-onnx?/bundled-onnxruntime"]

[dependencies]
chrono.workspace = true
engram-types = { path = "../engram-types" }
# ORT execution-provider wiring — optional so a build without ONNX Runtime
# drops it entirely. Gated by the `onnxruntime` feature.
engram-onnx = { path = "../engram-onnx", optional = true }
engram-storage = { path = "../engram-storage" }

# ONNX Runtime stack, optional under `onnxruntime` (default). A
# `--no-default-features` build excludes both.
fastembed = { version = "7.5", default-features = false, features = ["hf-hub-rustls-tls"], optional = true }
# `download-binaries` is enabled only by the `bundled-onnxruntime` strategy
# (above): under `load-dynamic` nothing is downloaded or linked, so the
# `ort-sys` build script's download path and its build dependencies (`ureq`,
# `lzma-rust2`, `hmac-sha256`) stay out of a default build. `tls-rustls` is
# kept so that, when `bundled-onnxruntime` does turn the download on, its
# `ureq` has a TLS backend (`tls_config(..)` only exists with one). See the
# longer note in `crates/engram-onnx/Cargo.toml`.
ort = { workspace = true, features = ["ndarray", "std", "tls-rustls"], optional = true }
# `tokenizers`, `hf-hub` and `ndarray` are used only by the
# `onnxruntime`-gated loaders (embeddings override, reranker, NLI, T5) to
# tokenize, fetch models and shape tensors, so they are optional under that
# feature: an Ollama-only build compiles none of them.
# Kept in lockstep with what `fastembed` requires (`^0.23.2` as of 7.5). A newer major
# here does NOT unify, so the workspace would build `tokenizers` — and its
# `onig`/`onig_sys` C dependency — twice for no gain. Bump this only when
# fastembed does.
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
ndarray = { version = "0.17", default-features = false, optional = true }
reqwest = { workspace = true, optional = true }

serde.workspace = true
# SHA-256 of built-in model files (`integrity`).
sha2.workspace = true

tokio.workspace = true
async-trait.workspace = true

tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[dev-dependencies]
engram-test-support = { path = "../engram-test-support" }
ctor.workspace = true

# Drives `fastembed` and `ort` directly to isolate where int8 nondeterminism
# comes from; neither exists without the ONNX Runtime stack.
[[example]]
name = "int8_determinism_bisect"
required-features = ["onnxruntime"]
