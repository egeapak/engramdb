[package]
name = "engram-cli"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Command-line interface and `engramdb` binary for EngramDB"
repository = "https://github.com/egeapak/engramdb"

[lib]
name = "engram_cli"
path = "src/lib.rs"

# The user-facing binary keeps its historical name (`engramdb`) so release
# artifacts and `cargo install` paths are unchanged after the split.
[[bin]]
name = "engramdb"
path = "src/main.rs"

[features]
default = ["onnxruntime", "load-dynamic", "ollama"]
# Forward the model/backend feature flags down to the engramdb core crate.
# `onnxruntime` (ONNX Runtime stack) is on by default; a pure-Rust build for a
# platform with no prebuilt ORT (Intel Mac) uses
# `--no-default-features --features tract`.
onnxruntime = ["engramdb/onnxruntime", "engram-mcp/onnxruntime"]
ollama = ["engramdb/ollama", "engram-mcp/ollama"]
coreml = ["engramdb/coreml"]
xnnpack = ["engramdb/xnnpack"]
# ONNX Runtime linking strategy; see the workspace root. `load-dynamic` is in
# `default`, so another strategy needs `--no-default-features`.
load-dynamic = ["engramdb/load-dynamic", "engram-mcp/load-dynamic"]
bundled-onnxruntime = ["engramdb/bundled-onnxruntime", "engram-mcp/bundled-onnxruntime"]

[dependencies]
engramdb = { path = "../..", default-features = false }
engram-mcp = { path = "../engram-mcp", default-features = false }

clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inquire = "0.9"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
shell-words = "1"
dirs = "6"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "process"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Unix-only: `dup2` to point a non-interactive `daemon run`'s stderr at the
# daemon log. Same crate the core uses for its geteuid()/SO_PEERCRED
# hardening, so this adds no new dependency to the tree.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["stdio"] }

[dev-dependencies]
engramdb = { path = "../..", default-features = false, features = ["test-support"] }
# `arm()`s the per-process data/config-dir isolation (#[ctor] in src/lib.rs) so
# in-crate command unit tests don't touch the real global dir under nextest.
engram-test-support = { path = "../engram-test-support" }
ctor = "1"
assert_cmd = "2"
predicates = "3"
regex = "1"
tempfile = "3"
