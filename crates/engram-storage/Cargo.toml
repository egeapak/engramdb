[package]
name = "engram-storage"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Storage + telemetry layer (MemoryStore, LanceDB index) for EngramDB"
repository = "https://github.com/egeapak/engramdb"

[lib]
name = "engram_storage"
path = "src/lib.rs"

[features]
# Exposes `test_support` (the global-store serialization lock) to downstream
# crates' test builds. `#[cfg(test)]` items are not visible across crates, so
# consumers enable this in their `dev-dependencies` instead.
test-support = []

[dependencies]
engram-types = { path = "../engram-types" }

lancedb.workspace = true
arrow-array.workspace = true
arrow-buffer = "58"
arrow-schema.workspace = true

serde.workspace = true
serde_json.workspace = true
# Pure-Rust YAML for memory-file frontmatter and the hidden metadata block;
# options are set in `memory_file/yaml.rs`. Only (de)serialization is needed,
# so the default `comments` feature is off.
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
toml.workspace = true

uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
zstd = "0.14"
dirs.workspace = true
# Data parallelism for the bulk CPU work on the read/reindex paths: parsing a
# store's worth of `.md` frontmatter and deriving keyword stems are both pure
# per-file transforms, and both were measurably the dominant cost of `reindex`
# (see `benches/parallel_simd.rs`).
rayon.workspace = true

tokio.workspace = true
futures-util.workspace = true
async-trait.workspace = true

tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tempfile.workspace = true

# `O_NOFOLLOW` for the state-file writer (`state_file.rs`). Unix-only: the
# flag has no Windows equivalent and no delivery path there either.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
engram-test-support = { path = "../engram-test-support" }
ctor.workspace = true
