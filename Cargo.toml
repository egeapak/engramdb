[workspace]
members = ["crates/*"]
# Treat the workspace as a whole: bare root commands (`cargo build`, `test`,
# `clippy`, `run`) act on every member, matching the `--workspace`-everywhere
# convention and letting `cargo build --bin engramdb` resolve the binary (which
# lives in `engram-cli`) without `-p`. Hand-pick a single crate with `-p` when
# you want a faster, narrower build.
default-members = [".", "crates/*"]

# Single source of truth for the workspace version. Every crate sets
# `version.workspace = true`, so a release bump is a one-line change here.
[workspace.package]
version = "0.9.0"

[package]
name = "engramdb"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Project-scoped persistent memory for coding agents"
repository = "https://github.com/egeapak/engramdb"

[lib]
name = "engramdb"
path = "src/lib.rs"

[features]
default = ["onnxruntime", "load-dynamic", "ollama"]
# ONNX Runtime stack (`ort` + `fastembed` + the `engram-onnx` EP wiring). On by
# default. A pure-Rust build for a platform with no prebuilt ORT (Intel Mac)
# uses `--no-default-features --features tract` instead.
onnxruntime = ["engram-models/onnxruntime", "dep:engram-onnx"]
ollama = ["reqwest", "engram-models/ollama"]
# Apple Core ML (GPU / Neural Engine) acceleration for all ONNX models.
# Enable on macOS only: `cargo build --features coreml`. Off by default so
# the Linux/CI build and prebuilt-binary download are unchanged. Forwarded to
# the model crates, which own the `ort` EP wiring.
coreml = ["onnxruntime", "engram-onnx/coreml", "engram-models/coreml"]
# XNNPACK portable CPU-kernel EP (per-node MLAS fallback). Off by default;
# the provider ships in the prebuilt `ort` binary so only this feature is
# needed (no source build, same downloaded binary). For A/B benchmarking.
xnnpack = ["onnxruntime", "engram-onnx/xnnpack", "engram-models/xnnpack"]
# --- ONNX Runtime linking strategy ---------------------------------------
# EngramDB does not vendor an ONNX Runtime. Exactly one of the three strategies
# below decides where `libonnxruntime` comes from; `load-dynamic` is in
# `default`, so selecting another means `--no-default-features`.
#
#   load-dynamic         (default) `ort` `dlopen`s the runtime on first use.
#                        Nothing is required at build time and one prebuilt
#                        binary works against any installed runtime >= 1.24, so
#                        this is what the release archives and the Homebrew /
#                        Scoop packages use. `engram_onnx::runtime` locates and
#                        validates the library before `ort` touches it.
#
#   bundled-onnxruntime  Download and statically link a prebuilt runtime — the
#                        historical default, kept as an escape hatch for
#                        platforms with no packaged ONNX Runtime and for
#                        hermetic builds. **Not recommended**: the pyke prebuilt
#                        it fetches executes quantized models incorrectly on
#                        AVX-512/AMX hosts (the same text embeds to unrelated
#                        vectors under CPU load), which is why it stopped being
#                        the default. See
#                        `docs/contributors/embedding-model-alternatives.md`
#                        (R6/R9).
#
# Examples:
#     cargo build --release                                   # load-dynamic
#     cargo build --release --no-default-features \
#         --features onnxruntime,ollama,bundled-onnxruntime
load-dynamic = ["engram-models/load-dynamic", "engram-onnx?/load-dynamic"]
bundled-onnxruntime = ["engram-models/bundled-onnxruntime", "engram-onnx?/bundled-onnxruntime"]
# Re-exports `engram-storage`'s `test_support` (global-store serialization lock)
# so downstream crates (engram-mcp, engram-cli) can use it in their test builds.
test-support = ["engram-storage/test-support"]

[dependencies]
# Workspace sub-crates (extracted layers; re-exported from lib.rs so the
# `engramdb::<module>` and `crate::<module>` paths stay stable in the core).
engram-types = { path = "crates/engram-types" }
# ONNX Runtime EP wiring, re-exported as `engramdb::onnx_ep`. Optional so a
# pure-`tract` build (Intel Mac) drops ORT entirely. Gated by `onnxruntime`.
engram-onnx = { path = "crates/engram-onnx", optional = true }
engram-storage = { path = "crates/engram-storage" }
engram-models = { path = "crates/engram-models", default-features = false }

# Vector DB (the core's daemon metrics + LanceDB index). The embedding /
# reranker / NLI models all live in the `engram-models` crate, so the core
# no longer depends on `fastembed` directly.
lancedb = { version = "0.31", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
arrow-array = "58"
arrow-schema = "58"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"

# Utilities
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
sha2 = "0.11"
dirs = "6"
jwalk = "0.8"
rayon = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Atomic file writes
tempfile = "3"

# Unix-only: safe geteuid() for the daemon's socket-permission hardening and
# SO_PEERCRED peer checks (already in the dependency tree via tempfile et al.).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# Enable storage's `test-support` module (global-store serialization lock) for
# this crate's tests; `#[cfg(test)]` items don't cross crate boundaries.
engram-storage = { path = "crates/engram-storage", features = ["test-support"] }
engram-test-support = { path = "crates/engram-test-support" }
ctor = "1"
rand = "0.10"
# Criterion benches live in this core crate (`benches/`); they exercise the
# re-exported model/ops/scoring APIs.
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
# The `examples/` are low-level ONNX/model benchmarks that drive `ort` /
# `tokenizers` / `hf-hub` directly (alongside the re-exported engramdb model
# APIs, which own the `fastembed` embedding/reranker paths), so they need those
# crates at dev time.
# `tls-rustls` pairs with `download-binaries` (the `ort-sys` build script's
# download path needs a TLS provider on `ureq`); see the note in
# `crates/engram-onnx/Cargo.toml`.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["download-binaries", "ndarray", "std", "tls-rustls"] }
# Must match `engram-models`' pin (which tracks fastembed's `^0.22.2`) —
# otherwise the examples pull a second, non-unifying `tokenizers` build.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", default-features = false, features = ["rustls-tls", "tokio", "ureq"] }
toml = "1"


[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "daemon_lifecycle"
harness = false

# Measures the three LanceDB leverage options (scalar indexes, typed filter
# expressions, tag pushdown via the FM index) plus the in-Rust keyword scorer
# they would replace. Kept separate from `benchmarks` so it can be run alone.
[[bench]]
name = "index_leverage"
harness = false

# A/B harness for the parallelization + SIMD work: every CPU-bound bulk path
# (memory-file parsing, keyword-stem derivation, composite scoring, pairwise
# cosine) measured in its current serial shape against the rayon / vectorized
# candidate. Separate target so it can be run alone and so the losing variants
# stay checked in as the record of what was tried.
[[bench]]
name = "parallel_simd"
harness = false

[[bench]]
name = "project_scan"
harness = false

# Dev/test disk diet: full debug info across the ~400-crate dependency tree
# (lance, datafusion, arrow, ort, …) made a single `--all-features` debug
# build ~25 GB — enough to exhaust CI sandboxes and small dev machines.
# Workspace crates keep line tables so panic backtraces still resolve to
# file:line; dependencies build with no debug info at all (their internals
# are rarely stepped through, and dropping symbols also speeds up linking).
# Debug a dependency by temporarily overriding, e.g.
# `[profile.dev.package.lance] debug = true`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1

# Build the crates that do the per-memory bulk work for speed, and leave the
# rest of the tree at the profile's "z". Chosen from what `reindex` actually
# spends its time in: TOML frontmatter deserialization, YAML for the legacy V1
# format, Snowball stemming for the keyword index, glob matching for scope
# scores, and EngramDB's own three data crates.
#
# Measured on a 1,200-memory `reindex --index-only`, 9 reps, interleaved
# against the other candidates:
#
#                            binary            reindex median
#   "z" everywhere      57,717,584  (+0.00%)   179 ms  (+0.0%)
#   these 14 at 3       60,573,968  (+4.95%)   161 ms (-10.1%)
#   whole tree at 2    110,273,616 (+91.06%)   147 ms (-17.9%)
#   whole tree at 3    116,212,976 (+101.4%)   144 ms (-19.6%)
#
# Half the available speedup for a twentieth of the size. The binary ships as
# a prebuilt artifact and is spawned per Claude Code hook invocation, so its
# size is download and cold-start cost — +91% to gain another 8% is not a
# trade worth making; +5% is.
#
# lance / datafusion / arrow / ort are deliberately absent: they dominate
# binary size and their hot loops are already inside compiled C++ or their own
# tuned Rust.
#
# Caveat worth knowing before extending this: per-package `opt-level` is only
# *mostly* effective under `lto = true`. A minimal two-crate reproduction
# produced a byte-identical binary, and overriding only EngramDB's core crate
# left no trace in the hot function — the fat-LTO link step re-runs the
# pipeline at the top-level opt-level and can discard the per-crate decisions.
# It evidently survives for large dependency crates, as the table shows. Do
# not assume an addition here helps; measure it.
[profile.release.package.toml]
opt-level = 3
[profile.release.package.toml_parser]
opt-level = 3
[profile.release.package.toml_datetime]
opt-level = 3
[profile.release.package.serde]
opt-level = 3
[profile.release.package.serde_yaml_ng]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.rust-stemmers]
opt-level = 3
[profile.release.package.globset]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.engramdb]
opt-level = 3
[profile.release.package.engram-storage]
opt-level = 3
[profile.release.package.engram-types]
opt-level = 3

# `opt-level` MUST match `[profile.release]`. It used to be 2 while release
# shipped "z", which does not merely make benchmarks optimistic — for
# codegen-sensitive code the two levels *rank candidates differently*. A dot
# product hand-unrolled into independent accumulators measured 4.4x faster than
# the baseline at opt-level 2 and 1.6x SLOWER than a naive loop at "z", so
# tuning against `cargo bench` shipped a pessimization. See
# `docs/contributors/parallelization-simd.md`.
#
# `lto` and `codegen-units` deliberately still differ from release: fat LTO with
# one codegen unit takes ~20 minutes to link this dependency tree, which would
# make the bench suite unusable for iteration. That leaves a known residual gap
# — cross-crate inlining — so a result that hinges on codegen should still be
# confirmed by disassembling a real release build before it is believed.
[profile.bench]
lto = false
opt-level = "z"
codegen-units = 16
