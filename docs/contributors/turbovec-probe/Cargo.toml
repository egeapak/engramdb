# Standalone measurement crate for docs/contributors/turbovec-evaluation.md.
#
# Deliberately NOT a workspace member and NOT a dev-dependency of any crate:
# the evaluation's conclusion is "don't adopt", so `turbovec` must not enter
# the workspace lockfile or the shipped binary's dependency graph. Same pattern
# as `fuzz/` — its own `[workspace]` table keeps `cargo build` at the repo root
# from ever reaching it.
[package]
name = "turbovec-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
turbovec = "1.0.0"
rand = "0.8"
rand_chacha = "0.3.1"
# `vs_lance` only — mirrors the versions engram-storage pins.
lancedb = { version = "0.31", default-features = false }
arrow-array = "58"
arrow-schema = "58"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "overhead"
path = "src/bin/overhead.rs"

[[bin]]
name = "allowlist"
path = "src/bin/allowlist.rs"

[[bin]]
name = "vs_lance"
path = "src/bin/vs_lance.rs"

[profile.release]
opt-level = 3
