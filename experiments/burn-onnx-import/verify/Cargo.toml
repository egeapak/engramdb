[package]
name = "burn-onnx-verify"
version = "0.0.0"
edition = "2021"
publish = false
description = "Stage 3: run burn-onnx-generated models and compare them with ONNX Runtime"

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex", "ndarray"] }
burn-ndarray = "=0.21.0"
burn-flex = "=0.21.0"
burn-store = { version = "=0.21.0", features = ["std", "burnpack"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "load-dynamic", "api-24"] }

# Same as EngramDB's release profile, so Burn numbers are comparable with
# the inference-engines harness.
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
